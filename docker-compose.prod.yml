# B-2/B-4: nginx :80 → web:3000, /api → api:8000. HTTP only. TLS is B-5.
# B-4 env: SESSION_COOKIE_SECURE=false in the repository-external file.
# EC2 기본 가정: t4g.small 2GiB. mem_limit은 컨테이너 RSS 상한이며 호스트 swap 1GiB와 별개다.
# 이미지는 공식 멀티아키. platform: linux/amd64 를 넣지 않는다.
# EC2 demo: pass a repository-external file with --env-file. Compose injects only listed names.
# postgres and redis must not publish host ports (TECH_STACK §5.1).
# After up: alembic upgrade head, then one public sync (TECH_STACK §5.1). Do not change default commands.
# worker는 상시 1. scale 0으로 두지 않는다. FastAPI 동기 마스킹과 합치지 않는다.

name: insurance-for-all-prod

services:
  postgres:
    image: postgres:17.11-alpine
    # 2GiB 호스트에서 기본 shared_buffers를 줄인다. 공공 캐시 전용이며 프로필 테이블은 없다.
    command:
      [
        "postgres",
        "-c",
        "shared_buffers=64MB",
        "-c",
        "max_connections=50",
        "-c",
        "work_mem=4MB",
      ]
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net-data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - net-data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    mem_limit: 256m
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCUMENT_RESULT_RETENTION_HOURS: ${DOCUMENT_RESULT_RETENTION_HOURS:-24}
      AI_REPORT_RETENTION_DAYS: ${AI_REPORT_RETENTION_DAYS:-7}
      CONSULTATION_RETENTION_DAYS: ${CONSULTATION_RETENTION_DAYS:-30}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-v1}
      CONSULTATION_CONSENT_NOTICE_VERSION: ${CONSULTATION_CONSENT_NOTICE_VERSION}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER}
      REPORT_TOKEN_PEPPER: ${REPORT_TOKEN_PEPPER}
      CONSULTATION_NOTIFY_EMAIL: ${CONSULTATION_NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PYTHONUNBUFFERED: "1"
    volumes:
      - pdf_staging:/var/ifa/staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - net-app
      - net-data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    mem_limit: 320m
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCUMENT_RESULT_RETENTION_HOURS: ${DOCUMENT_RESULT_RETENTION_HOURS:-24}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DATA_GO_KR_MEDICAL_API_KEY: ${DATA_GO_KR_MEDICAL_API_KEY}
      DATA_GO_KR_AUTO_API_KEY: ${DATA_GO_KR_AUTO_API_KEY}
      DATA_GO_KR_LIFE_API_KEY: ${DATA_GO_KR_LIFE_API_KEY}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      PYTHONUNBUFFERED: "1"
    volumes:
      - pdf_staging:/var/ifa/staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - net-data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    mem_limit: 384m
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      api:
        condition: service_healthy
    networks:
      - net-edge
    restart: unless-stopped

  nginx:
    image: nginx:1.30.4-alpine
    mem_limit: 64m
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - net-edge
      - net-app
    restart: unless-stopped

networks:
  net-edge:
  net-app:
  net-data:

volumes:
  postgres_data:
  pdf_staging:
