# HTTP 진입점. TLS·도메인·인증서는 B-5. 호스트명·IP를 고정하지 않는다.
# /api 접두사는 유지한다. api는 GET /api/health 와 /api/v1/* 를 받는다.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 앱 PDF 한도는 10MiB. nginx가 먼저 413 내지 않도록 여유를 둔다.
    client_max_body_size 12m;

    # 쿼리·Authorization은 남기지 않는다.
    log_format main '$remote_addr $request_method $uri $status';
    access_log /var/log/nginx/access.log main;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        location /api {
            proxy_pass http://api:8000;
            proxy_set_header Authorization $http_authorization;
        }

        location / {
            proxy_pass http://web:3000;
        }
    }
}
