# Local development. Do not bake secrets into images.
# Copy .env.example → .env and fill values locally. Never commit .env.
# Browser → web:3000 /api/* is rewritten to api:8000 (Next rewrites).
# Port 8000 is for host curl/tests only; browser calls must remain same-origin /api.

name: insurance-for-all

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - pdf_staging:/var/ifa/staging
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCUMENT_RESULT_RETENTION_HOURS: ${DOCUMENT_RESULT_RETENTION_HOURS:-24}
      AI_REPORT_RETENTION_DAYS: ${AI_REPORT_RETENTION_DAYS:-7}
      CONSULTATION_RETENTION_DAYS: ${CONSULTATION_RETENTION_DAYS:-30}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-v1}
      CONSULTATION_CONSENT_NOTICE_VERSION: ${CONSULTATION_CONSENT_NOTICE_VERSION}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      CONTACT_ENCRYPTION_KEY: ${CONTACT_ENCRYPTION_KEY}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER}
      REPORT_TOKEN_PEPPER: ${REPORT_TOKEN_PEPPER}
      CONSULTATION_NOTIFY_EMAIL: ${CONSULTATION_NOTIFY_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PYTHONUNBUFFERED: "1"
    command:
      - sh
      - -c
      - pip install --no-cache-dir -r requirements.txt && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    image: python:3.12-slim
    working_dir: /opt/worker
    volumes:
      - ./apps/worker:/opt/worker
      - ./apps/api:/opt/api
      - pdf_staging:/var/ifa/staging
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCUMENT_RESULT_RETENTION_HOURS: ${DOCUMENT_RESULT_RETENTION_HOURS:-24}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DATA_GO_KR_MEDICAL_API_KEY: ${DATA_GO_KR_MEDICAL_API_KEY}
      DATA_GO_KR_AUTO_API_KEY: ${DATA_GO_KR_AUTO_API_KEY}
      DATA_GO_KR_LIFE_API_KEY: ${DATA_GO_KR_LIFE_API_KEY}
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-1}
      PYTHONPATH: /opt/api:/opt/worker
      PYTHONUNBUFFERED: "1"
    command:
      - sh
      - -c
      - pip install --no-cache-dir -r requirements.txt && exec celery -A worker.app worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:24-bookworm-slim
    working_dir: /workspace/apps/web
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
    environment:
      API_INTERNAL_URL: http://api:8000
    command:
      - sh
      - -c
      - npm ci && exec npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pdf_staging:
  web_node_modules:
